<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Our Love Story Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d5a80;--acc:#7cc4f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#3d5a80}}
:root[data-theme="dark"]{--ink:#3d5a80}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Quicksand,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#e3f4ff,#d3eaff 55%,#e6e0ff);overflow-x:hidden}
h2{font-family:'Dancing Script',cursive;font-size:clamp(1.8rem,7vw,2.6rem);color:#4f86c6;text-shadow:0 0 16px #fff;margin-bottom:8px}
p{line-height:1.5}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#ffffffaa;backdrop-filter:blur(8px)}
#top b{flex:1;text-align:center;font-size:.9rem}
#dots{display:flex;gap:4px;justify-content:center;padding:6px}#dots i{width:18px;height:5px;border-radius:5px;background:#c5def5}#dots i.d{background:#7cc4f5}#dots i.c{background:#4f86c6}
.nav{border:0;background:#fff;border-radius:99px;width:38px;height:38px;font-size:1.1rem;color:var(--ink);box-shadow:0 2px 8px #7aa9d855;cursor:pointer}.nav:disabled{opacity:.35;cursor:default}
#stage{min-height:calc(100svh - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 16px 40px;position:relative;animation:in .7s ease}
@keyframes in{from{opacity:0;transform:translateX(40px) scale(.96)}}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}#bg span{position:absolute;animation:fl 6s ease-in-out infinite;opacity:.55}
#stage,#top,#dots{position:relative;z-index:2}#top{position:sticky}
@keyframes fl{50%{transform:translateY(-16px) rotate(8deg)}}
@keyframes pulse{50%{transform:scale(1.15)}}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.btn{border:0;border-radius:99px;padding:12px 24px;font:600 1rem Quicksand;color:#fff;background:linear-gradient(135deg,#8fd0ff,#6fa8f0);box-shadow:0 6px 18px #7cc4f588;cursor:pointer;transition:.25s}.btn:hover{transform:scale(1.06)}
.card{background:#ffffffdd;border-radius:22px;padding:22px;box-shadow:0 10px 36px #7aa9d855;max-width:460px;width:100%}
#msg{min-height:1.6em;margin-top:12px;font-weight:600;color:#4f86c6}
.fx{position:fixed;top:-24px;pointer-events:none;z-index:60;animation:fall linear forwards}@keyframes fall{to{transform:translate(30px,110vh) rotate(300deg)}}
.ph{aspect-ratio:1;background:linear-gradient(135deg,#cfe9ff,#e4dcff);position:relative;overflow:hidden}.ph::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;color:#7aa0d0;font-size:.8rem}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:520px;width:100%;position:relative}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr);max-width:820px}}
.pol{background:#fff;padding:7px 7px 22px;box-shadow:0 8px 20px #5a8fc855;border:0;cursor:pointer;transform:rotate(var(--r));transition:all .8s;font:inherit;color:inherit}.pol:hover{transform:scale(1.06)}.pol.v{outline:3px solid #8fd0ff}
.grid.col .pol{position:absolute;left:50%;top:50%;margin:-70px 0 0 -70px;width:140px;transform:rotate(calc(var(--r)*3)) translate(calc(var(--r)*4),0)}
#lb{position:fixed;inset:0;background:#2a4a7acc;display:none;place-items:center;z-index:50;padding:20px}#lb.on{display:grid}#lb .pol{max-width:420px;width:100%;animation:zin .5s;transform:none;cursor:default}@keyframes zin{from{transform:scale(.3);opacity:0}}
.pad{touch-action:none;user-select:none;cursor:grab}
.flip{width:46%;max-width:170px;aspect-ratio:3/4;perspective:700px;border:0;background:none;cursor:pointer}.flip div{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;transition:transform .7s;display:grid;place-items:center;padding:10px;font-size:.9rem;box-shadow:0 6px 18px #6a9fd666}.flip .f{background:linear-gradient(135deg,#9fd6ff,#c3b6f5);font-size:2rem}.flip .b{background:#fff;transform:rotateY(180deg)}.flip{position:relative}.flip.on .f{transform:rotateY(-180deg)}.flip.on .b{transform:rotateY(0)}
.chk{display:flex;align-items:center;gap:12px;padding:12px;background:#f0f8ff;border-radius:14px;margin:8px 0;text-align:left;cursor:pointer;width:100%;border:0;font:inherit;color:inherit}.chk b{width:26px;height:26px;border-radius:8px;border:2px solid var(--acc);display:grid;place-items:center;color:#fff;flex:none}.chk.d{background:#d9efff}.chk.d b{background:var(--acc)}
.wv{display:flex;gap:4px;align-items:center;justify-content:center;height:50px}.wv i{width:6px;height:10px;border-radius:4px;background:linear-gradient(#8fd0ff,#b9a8f0)}.wv.on i{animation:wv .8s ease-in-out infinite alternate}@keyframes wv{to{height:46px}}
.bar{height:8px;background:#d8ebfb;border-radius:9px;margin:12px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fd0ff,#b9a8f0);border-radius:9px}
input[type=date],input[type=file]{font:inherit;padding:10px;border-radius:12px;border:2px solid #b7dbf8;color:var(--ink)}input[type=file]{display:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#end{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:#e3f4ffee;text-align:center;padding:20px}#end.on{display:grid}#end .big{font-size:40vmin;animation:pulse 1.4s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="bg"></div>
<div id="top"><button class="nav" id="bk" aria-label="Back">‹</button><b id="pn">PAGE 1/11</b><button class="nav" id="fw" aria-label="Forward to unlocked page">›</button></div>
<div id="dots"></div>
<main id="stage" aria-live="polite"></main>
<div id="lb" role="dialog"><div class="pol"><div class="ph" id="lbp"><img></div><p id="lbc" style="margin-top:8px"></p></div></div>
<div id="end"><div><div class="big">💙</div><h2>I love you, forever &amp; always</h2><p contenteditable>Happy anniversary, my love. Thank you for being mine.</p></div></div>
<input type="file" id="up" accept="image/*" multiple><audio id="au"></audio><input type="file" id="af" accept="audio/*">
<script>
const ANNIVERSARY_DATE="2023-02-01"; // EDIT ME: your real anniversary, format YYYY-MM-DD (placeholder!)
const AUDIO_SRC=""; // OPTIONAL: path to your voice recording, e.g. "voice.mp3"
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let S;try{S=JSON.parse(sessionStorage.getItem('st'))}catch(e){}S=S||{cur:0,max:0,done:{}};
const save=()=>{try{sessionStorage.setItem('st',JSON.stringify(S))}catch(e){}};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
$('#bg').innerHTML=['🦋','✨','💙','🕊️','💌','⭐','🦋','💙'].map((c,i)=>`<span style="left:${(i*13+6)%92}%;top:${(i*29+8)%88}%;animation-delay:${i*.7}s;font-size:${18+i%3*8}px">${c}</span>`).join('');
$('#dots').innerHTML=Array.from({length:11},()=>'<i></i>').join('');
function drop(a,n){if(RM)return;for(let i=0;i<n;i++)setTimeout(()=>{const p=document.createElement('span');p.className='fx';p.textContent=a[i%a.length];p.style.left=Math.random()*100+'vw';p.style.fontSize=14+Math.random()*18+'px';p.style.animationDuration=3.5+Math.random()*3+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),7000)},i*90)}
function drag(el,mv,end){el.style.touchAction='none';el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);const x0=e.clientX,y0=e.clientY;el.onpointermove=v=>mv(v.clientX-x0,v.clientY-y0,v);el.onpointerup=el.onpointercancel=v=>{el.onpointermove=el.onpointerup=el.onpointercancel=null;end&&end(v.clientX-x0,v.clientY-y0,v)}}}
const P=Array.from({length:8},(_,i)=>'photo'+(i+1)+'.jpg');
function imgs(){$$('img[data-k]').forEach(im=>{im.src=P[im.dataset.k];im.onerror=()=>im.style.display='none';im.onload=()=>im.style.display=''})}
let tk=0,cur=0;
function win(i,msg,adv=true){if(S.done[i]&&adv===false)return;S.done[i]=1;S.max=Math.max(S.max,Math.min(i+1,10));save();if(cur===i){const m=$('#msg');if(m)m.textContent=msg;drop(['💙','✨','🦋','🤍'],26);}hud();if(adv&&i<10)setTimeout(()=>{if(cur===i)go(i+1)},2600)}
function hud(){$('#pn').textContent=`PAGE ${cur+1}/11`;$('#bk').disabled=cur==0;$('#fw').disabled=!(S.done[cur]&&cur<S.max);$$('#dots i').forEach((d,i)=>d.className=i==cur?'c':S.done[i]?'d':'')}
function go(i){if(i<0||i>10||i>S.max)return;cur=i;S.cur=i;save();tk++;const st=$('#stage');st.style.animation='none';st.offsetHeight;st.style.animation='';st.innerHTML='';PG[i](st,tk,i);if(S.done[i]&&i<10){st.insertAdjacentHTML('beforeend','<p class="tiny" style="margin-top:10px">✓ Completed — use › to continue</p>')}imgs();hud();window.scrollTo(0,0)}
$('#bk').onclick=()=>go(cur-1);$('#fw').onclick=()=>go(cur+1);
const M='<p id="msg" role="status"></p>';
const PG=[];
// 1 cupid
PG[0]=(el,t,i)=>{el.innerHTML=`<h2>Help Cupid 💘</h2><p>Drag the glowing string back, then let go.</p><svg id="sc" viewBox="0 0 320 300" width="min(94vw,430px)" style="touch-action:none"><text x="0" y="95" font-size="58">👼</text><path d="M60 60Q135 150 60 240" fill="none" stroke="#7aa8e0" stroke-width="6" stroke-linecap="round"/><path id="str" d="M60 60L60 150L60 240" stroke="#fff" stroke-width="2.5" fill="none"/><g id="ar"><line x1="60" y1="150" x2="140" y2="150" stroke="#8a7fd0" stroke-width="3"/><path d="M140 150l-10-6v12z" fill="#8a7fd0"/></g><text id="hr" x="265" y="180" font-size="90" text-anchor="middle" style="filter:drop-shadow(0 0 14px #8fd0ff);transform-origin:265px 150px">💙</text><circle id="nk" cx="60" cy="150" r="34" fill="#8fd0ff" fill-opacity=".25" pointer-events="all" tabindex="0" role="button" aria-label="Pull bowstring" style="cursor:grab"/></svg>${M}`;
const nk=$('#nk'),sc=$('#sc');let p=0,shot=!!S.done[i];
const set=q=>{p=q;$('#str').setAttribute('d',`M60 60L${60-q} 150L60 240`);$('#ar').setAttribute('transform',`translate(${-q})`);nk.setAttribute('cx',60-q)};
function shoot(){shot=true;let x=-p,t0=performance.now();const from=-p;(function f(n){const k=Math.min(1,(n-t0)/(RM?1:450));set(-(from+(125-from)*k));if(k<1)requestAnimationFrame(f);else{$('#hr').textContent='💘';$('#hr').style.animation='pulse .6s 4';nk.remove();win(i,'Bullseye! Cupid struck your heart 💘')}})(t0)}
drag(nk,dx=>{if(shot)return;set(Math.max(0,Math.min(45,-dx*320/sc.getBoundingClientRect().width)))},()=>{if(shot)return;p>18?shoot():set(0)});
nk.onkeydown=e=>{if(!shot&&(e.key=='Enter'||e.key==' ')){set(40);setTimeout(shoot,300)}};
if(shot){$('#hr').textContent='💘';nk.remove();set(-125)}};
// 2 date
PG[1]=(el,t,i)=>{el.innerHTML=`<div class="card"><div style="font-size:3rem">👫📅</div><h2>When did our beautiful story begin? 💙</h2><p><input type="date" id="dt" aria-label="Anniversary date"></p><div class="row"><button class="btn" id="ck">Check 💙</button></div>${M}</div>`;
$('#ck').onclick=()=>{const v=$('#dt').value,c=$('.card');if(v===ANNIVERSARY_DATE){c.innerHTML='<div style="font-size:3rem">📅💙</div><h2>Yayyy! You remembered our special day! 💙</h2>'+M;drop(['💙','📅'],20);win(i,'')}else{c.style.animation='none';c.offsetHeight;c.style.animation='shake .5s';$('#msg').textContent='Oops! Try remembering our special day again! 🥺'}}};
// 3 tree
PG[2]=(el,t,i)=>{el.innerHTML=`<h2>Find the 5 hidden hearts</h2><div style="position:relative;width:min(94vw,360px)"><canvas id="cv" width="360" height="330" style="width:100%"></canvas><div id="hh"></div></div><p id="cnt">0/5</p>${M}`;
const cv=$('#cv'),x=cv.getContext('2d'),hs=[];let f=S.done[i]?5:0;
for(let k=0;k<300;k++){const a=Math.random()*6.283,r=Math.sqrt(Math.random());hs.push({x:180+16*Math.pow(Math.sin(a),3)*r*10.5,y:150-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*r*8.5,s:5+Math.random()*6,c:['#8fd0ff','#bfe4ff','#fff','#b9a8f0','#a0c8f5','#f6cfe3'][k%6],d:Math.random()*9})}
const H=(X,Y,s,c)=>{x.fillStyle=c;x.beginPath();x.moveTo(X,Y+s*.35);x.bezierCurveTo(X-s,Y-s*.4,X-s*.5,Y-s,X,Y-s*.35);x.bezierCurveTo(X+s*.5,Y-s,X+s,Y-s*.4,X,Y+s*.35);x.fill()};
let T=0;(function d(){if(t!==tk)return;T++;x.clearRect(0,0,360,330);x.fillStyle='#b99a86';x.beginPath();x.moveTo(170,330);x.quadraticCurveTo(176,260,180,215);x.quadraticCurveTo(184,260,190,330);x.fill();x.shadowColor='#8fd0ff';x.shadowBlur=f*5;hs.forEach(h=>H(h.x,h.y+Math.sin(T/30+h.d)*1.5,h.s*(1+f*.04),h.c));x.shadowBlur=0;requestAnimationFrame(d)})();
const pos=[[8,10],[84,18],[6,55],[88,60],[46,92]];
$('#hh').innerHTML=pos.map((q,k)=>`<button data-k="${k}" aria-label="Hidden heart" style="position:absolute;left:${q[0]}%;top:${q[1]}%;border:0;background:none;font-size:30px;opacity:.35;cursor:pointer;filter:drop-shadow(0 0 6px #fff)">💙</button>`).join('');
$$('#hh button').forEach(b=>b.onclick=()=>{if(b.dataset.f)return;b.dataset.f=1;b.style.opacity=1;b.style.visibility='hidden';f++;$('#cnt').textContent=f+'/5';if(f==5){$('#cv').style.animation='pulse 1s 3';win(i,'Every heart on this tree grew from loving you 💙')}});
if(S.done[i]){$('#hh').innerHTML='';$('#cnt').textContent='5/5'}};
// 4 rose
PG[3]=(el,t,i)=>{el.innerHTML=`<h2>A rose for you 🌹</h2><p id="hint">Tap the glowing rose</p><div id="rz" style="position:relative;width:min(90vw,300px);height:260px;margin:10px auto"><button id="rs" aria-label="Rose" style="position:absolute;left:50%;top:20px;margin-left:-60px;width:120px;height:120px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle,#6aa8ea 8%,#a9d4ff 9% 22%,#7cb6f0 23% 36%,#d4eaff 37% 52%,#9bcbf7 53% 70%,#fff 71%);box-shadow:0 0 30px #8fd0ff;animation:pulse 2s infinite;transition:transform 1.2s"></button><div id="bs" style="position:absolute;left:50%;bottom:0;margin-left:-70px;width:140px;height:60px;border-radius:0 0 70px 70px;background:#ffffffaa;border:2px dashed #8fd0ff;display:grid;place-items:center;font-size:.8rem">🧺 drop petals</div></div>${M}`;
let n=0,on=false;const rs=$('#rs');
function start(){if(on)return;on=true;$('#hint').textContent='Drag each petal into the basket';
[[10,40],[78,40],[16,120],[74,120],[46,150]].forEach(q=>{const p=document.createElement('div');p.textContent='🌸';p.className='pad';p.tabIndex=0;p.style.cssText=`position:absolute;left:${q[0]}%;top:${q[1]}px;font-size:34px`;$('#rz').append(p);let bx=0,by=0;drag(p,(dx,dy)=>p.style.transform=`translate(${bx+dx}px,${by+dy}px)`,(dx,dy)=>{bx+=dx;by+=dy;const a=p.getBoundingClientRect(),b=$('#bs').getBoundingClientRect();if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top){p.remove();n++;if(n==5){rs.style.transform='scale(1.35)';drop(['🌸','🌹','🤍'],30);win(i,'You are the most beautiful bloom in my life 🌹')}}})})}
rs.onclick=start;if(S.done[i]){rs.style.transform='scale(1.35)';$('#hint').textContent='';on=true}};
// 5 couple
PG[4]=(el,t,i)=>{el.innerHTML=`<h2>Bring them together 💞</h2><p>Drag both of them toward each other</p><div id="tr" style="position:relative;width:min(94vw,420px);height:140px;margin:20px 0"><div class="pad" id="c1" tabindex="0" style="position:absolute;left:0;font-size:76px">👦</div><div class="pad" id="c2" tabindex="0" style="position:absolute;right:0;font-size:76px">👧</div></div>${M}`;
const tr=$('#tr'),c1=$('#c1'),c2=$('#c2');let fin=!!S.done[i];
function meet(){if(fin&&!S.done[i]===false)return;fin=true;c1.remove();c2.remove();tr.innerHTML='<div style="font-size:110px;text-align:center;animation:pulse 1s infinite">🫂</div>';win(i,'Together is our favourite place 💙')}
const W=()=>tr.clientWidth-76;
[c1,c2].forEach((c,k)=>{let b=0,x=0;const cl=v=>Math.max(0,Math.min(W()/2-15,v));drag(c,dx=>{if(fin)return;x=cl(b+(k?-dx:dx));c.style[k?'right':'left']=x+'px';if(c1.offsetLeft+76>c2.offsetLeft-4)meet()},()=>b=x);c.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){x=cl(x+W()/4);b=x;c.style[k?'right':'left']=x+'px';if(c1.offsetLeft+76>c2.offsetLeft-4)meet()}}});
if(fin){c1.remove();c2.remove();tr.innerHTML='<div style="font-size:110px;text-align:center">🫂</div>'}};
// 6 polaroids
PG[5]=(el,t,i)=>{const cp=['Our first smile','Just us','Sweet day','Favourite place','Laughing together','Little moment','Forever','Always you'],v=new Set(S.done[i]?[0,1,2,3,4,5,6,7]:[]);
el.innerHTML=`<h2>Our Polaroids 📸</h2><p id="cn">Open all 8 photos: <b>${v.size}/8</b></p><div class="grid" id="g">${P.map((p,k)=>`<button class="pol" style="--r:${[-5,4,-3,6,3,-6,5,-4][k]}deg" data-k="${k}"><div class="ph" data-n="photo${k+1}"><img data-k="${k}" alt="Photo ${k+1}"></div><p style="font-size:.8rem;margin-top:5px">${cp[k]}</p></button>`).join('')}</div><div class="row"><button class="btn" onclick="$('#up').click()">Add my photos 📷</button></div>${M}`;
$$('#g .pol').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$('#lb img').dataset.k=k;$('#lbp').dataset.n='photo'+(k+1);$('#lbc').textContent=cp[k];imgs();$('#lb').classList.add('on');b.classList.add('v');v.add(k);$('#cn').innerHTML=`Open all 8 photos: <b>${v.size}/8</b>`;$('#lb').dataset.chk=1});
$('#lb').onclick=()=>{$('#lb').classList.remove('on');if(v.size==8&&cur==5&&!S.done[i]){$('#g').classList.add('col');win(i,'Every moment with you is my favourite 📸💙')}}};
$('#up').onchange=e=>{[...e.target.files].slice(0,8).forEach((f,k)=>P[k]=URL.createObjectURL(f));imgs()};
// 7 gift
PG[6]=(el,t,i)=>{el.innerHTML=`<h2>Untie the ribbon 🎀</h2><p>Press and hold the ribbon</p><div style="position:relative;width:220px;height:230px;margin:20px auto"><div id="in" style="position:absolute;left:30px;top:20px;width:160px;opacity:0;transition:opacity 1s .5s"><div class="ph" style="border:6px solid #fff;border-radius:10px" data-n="photo1"><img data-k="0"></div></div><div id="lid" style="position:absolute;left:5px;top:70px;width:210px;height:42px;border-radius:10px;background:linear-gradient(#9fd6ff,#7cb6f0);transition:all .9s;z-index:3"></div><div style="position:absolute;left:15px;top:110px;width:190px;height:115px;border-radius:0 0 12px 12px;background:linear-gradient(#b4dcff,#8cc4f4);z-index:2"></div><div style="position:absolute;left:100px;top:70px;width:20px;height:155px;background:#fff9;z-index:4"></div><button id="rb" class="pad" aria-label="Hold to untie ribbon" style="position:absolute;left:70px;top:44px;width:80px;height:60px;font-size:50px;border:0;background:none;z-index:5;transition:all .6s">🎀</button></div><div class="bar" style="width:200px"><i id="pr"></i></div>${M}`;
const rb=$('#rb'),pr=$('#pr');let ti,w=0;
function open(){clearInterval(ti);rb.style.opacity=0;rb.style.transform='translateY(-40px) rotate(40deg)';$('#lid').style.transform='translate(30px,-70px) rotate(25deg)';$('#in').style.opacity=1;$('#in').style.transform='translateY(-30px)';drop(['💙','⭐','🦋','✨'],30);win(i,'Surprise! You are my greatest gift 🎁')}
const hold=()=>{if(S.done[i])return;clearInterval(ti);ti=setInterval(()=>{w+=5;pr.style.width=w+'%';if(w>=100)open()},80)},rel=()=>{clearInterval(ti);if(w<100){w=0;pr.style.width=0}};
rb.onpointerdown=e=>{e.preventDefault();hold()};rb.onpointerup=rb.onpointerleave=rb.onpointercancel=rel;rb.onkeydown=e=>{if(e.key==' '||e.key=='Enter'){e.preventDefault();hold()}};rb.onkeyup=rel;rb.style.touchAction='none';
if(S.done[i]){rb.style.opacity=0;$('#lid').style.transform='translate(30px,-70px) rotate(25deg)';$('#in').style.opacity=1;pr.style.width='100%'}};
// 8 cards
PG[7]=(el,t,i)=>{const m=['You make me smile 😊','You are my home 🏡','I choose you daily 💙','You’re my best friend 🫶','Forever starts with you ♾️','My heart is yours 💌'];let n=S.done[i]?6:0;
el.innerHTML=`<h2>Flip every card 💌</h2><div class="row" style="width:min(94vw,420px)">${m.map(x=>`<button class="flip ${n?'on':''}" aria-label="Flip card"><div class="f">💙</div><div class="b">${x}</div></button>`).join('')}</div>${M}<div id="end2" style="font-family:'Dancing Script';font-size:1.6rem;margin-top:8px"></div>`;
$$('.flip').forEach(c=>c.onclick=()=>{if(c.classList.contains('on'))return;c.classList.add('on');n++;if(n==6){$('#end2').textContent='Secret: you are my forever 💙';win(i,'You found them all!')}})};
// 9 seal
PG[8]=(el,t,i)=>{const L='My dearest love,\n\nFrom the moment you came into my life, everything turned soft and blue and bright. You turned ordinary days into stories I never want to end.\n\nThank you for your patience, your laughter and the way you hold my hand when the world feels loud.\n\nI promise to keep choosing you, to keep dreaming with you and to keep loving you, today and every tomorrow.\n\nForever yours 💙';
el.innerHTML=`<h2>Break the seal 💌</h2><p id="hint">Drag the heart seal away</p><div style="position:relative;width:280px;height:300px;margin:14px auto"><div id="lt" style="position:absolute;left:20px;top:0;width:240px;height:230px;background:#fff;border-radius:8px;box-shadow:0 6px 20px #6a9fd666;padding:12px;overflow:auto;text-align:left;font-size:.85rem;white-space:pre-wrap;transform:scaleY(.1);transform-origin:top;transition:transform 1.2s .5s,top 1s .3s;z-index:1" tabindex="0">${L}</div><div style="position:absolute;left:0;top:90px;width:280px;height:200px;background:#c3e1fb;border-radius:8px;z-index:2;clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%);background:linear-gradient(#fff,#d4eaff)"></div><div id="fp" style="position:absolute;left:0;top:90px;width:280px;height:110px;background:#e9f5ff;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3"></div><button id="sl" class="pad" aria-label="Heart seal" style="position:absolute;left:112px;top:150px;font-size:56px;border:0;background:none;z-index:5">💙</button></div>${M}`;
const sl=$('#sl'),lt=$('#lt');let br=!!S.done[i];
function brk(){if(br&&!S.done[i]===false&&false)return;br=true;sl.style.transition='all .6s';sl.style.opacity=0;sl.style.transform+=' scale(2)';$('#fp').style.transform='rotateX(180deg)';$('#fp').style.zIndex=0;lt.style.top='-110px';lt.style.zIndex=4;lt.style.transform='scaleY(1)';$('#hint').textContent='Scroll to read the whole letter';drop(['💙','💌'],16);chk()}
function chk(){if(lt.scrollTop+lt.clientHeight>=lt.scrollHeight-6)win(i,'Every word is true 💙')}
lt.onscroll=()=>{if(br)chk()};
let bx=0,by=0;drag(sl,(dx,dy)=>{if(br)return;sl.style.transform=`translate(${dx}px,${dy}px)`;if(Math.hypot(dx,dy)>70)brk()});sl.onkeydown=e=>{if(e.key=='Enter'||e.key==' ')brk()};
if(br){sl.remove();$('#fp').style.transform='rotateX(180deg)';$('#fp').style.zIndex=0;lt.style.top='-110px';lt.style.zIndex=4;lt.style.transform='none'}};
// 10 voice
PG[9]=(el,t,i)=>{const a=$('#au');a.pause();if(AUDIO_SRC&&!a.src)a.src=AUDIO_SRC;
el.innerHTML=`<div class="card"><div style="font-size:3.4rem" id="ch">👧🎧</div><h2>A voice note for you</h2><div class="wv" id="wv">${'<i></i>'.repeat(24).replace(/<i>/g,()=>`<i style="animation-delay:${Math.random()*.8}s">`)}</div><div class="bar"><i id="pg"></i></div><div class="row"><button class="btn" id="pl">▶ Play</button><button class="btn" onclick="$('#af').click()">Upload audio</button><button class="btn" id="ts" style="background:#b9a8f0">Test (4s preview)</button></div>${M}</div>`;
let test=0,sim;const fin=()=>{$('#wv').classList.remove('on');$('#pl').textContent='▶ Play';$('#pg').style.width='100%';(S.done[i]||win(i,'I love you, and now you’ve heard it 💙'))};
$('#pl').onclick=()=>{if(!a.src)return $('#msg').textContent='No audio yet: upload one or use the test preview 💙';a.paused?a.play():a.pause()};
a.onplay=()=>{$('#wv').classList.add('on');$('#pl').textContent='❚❚ Pause'};a.onpause=()=>{$('#wv').classList.remove('on');$('#pl').textContent='▶ Play'};
a.ontimeupdate=()=>{if(cur==9)$('#pg').style.width=(a.currentTime/a.duration*100||0)+'%'};a.onended=()=>{if(cur==9)fin()};
$('#ts').onclick=()=>{clearInterval(sim);$('#wv').classList.add('on');let s=0;sim=setInterval(()=>{s+=100;$('#pg').style.width=s/40+'%';if(s>=4000){clearInterval(sim);fin()}},100)};
if(S.done[i])$('#pg').style.width='100%'};
$('#af').onchange=e=>{$('#au').src=URL.createObjectURL(e.target.files[0]);if(cur==9&&$('#msg'))$('#msg').textContent='Audio loaded ♡ press Play'};
// 11 final
PG[10]=(el,t,i)=>{const it=['I shot Cupid’s arrow 💘','I remembered our day 📅','I found every heart 💙','I know I am loved 🌹'];let n=S.done[i]?4:0;
el.innerHTML=`<div style="font-size:3rem">🏹👫🦋</div><h2>One last thing…</h2><div class="card">${it.map(x=>`<button class="chk ${n?'d':''}"><b>${n?'✓':''}</b>${x}</button>`).join('')}<div class="ph" data-n="photo1" style="width:60%;margin:10px auto;border:6px solid #fff;display:${n?'block':'none'}" id="fp1"><img data-k="0"></div><div id="fin" style="font-family:'Dancing Script';font-size:1.6rem">${n?'I love you, now and always 💙':''}</div></div>${M}`;
function celebrate(){$('#end').classList.add('on');drop(['💙','🤍','💙','✨','🎉','🦋','💍'],90);$('#fin').textContent='I love you, now and always 💙';$('#fp1').style.display='block';imgs();S.done[i]=1;save()}
$$('.chk').forEach(c=>c.onclick=()=>{if(c.classList.contains('d'))return;c.classList.add('d');c.querySelector('b').textContent='✓';n++;if(n==4)celebrate()});
$('#end').onclick=()=>$('#end').classList.remove('on')};
go(Math.min(S.cur||0,S.max));
</script></body></html>
